[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pocketpad"
version = "0.3.0"
description = "Use your phone as a precision-style trackpad for Windows, macOS and Linux over Wi-Fi, hotspot or USB. No app to install on the phone."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Vasudev Siddh" }]
keywords = ["trackpad", "touchpad", "remote", "mouse", "windows", "phone", "gestures"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]
dependencies = [
  "aiohttp>=3.9",
  "qrcode>=7.4",
  "pynput>=1.7; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pyinstaller>=6"]

[project.scripts]
pocketpad = "pocketpad.main:main"

[project.urls]
Homepage = "https://github.com/vasu-devs/PocketPad"
Issues = "https://github.com/vasu-devs/PocketPad/issues"

[tool.setuptools]
packages = ["pocketpad"]

[tool.setuptools.package-data]
pocketpad = ["web/*", "web/assets/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
