<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1113">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PocketPad">
<title>PocketPad</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="bar" id="topbar">
  <span class="brand">PocketPad</span>
  <span class="status" id="status" aria-live="polite">Connecting</span>
  <div class="bar-actions">
    <button class="bar-btn" id="kbd-btn" type="button" aria-label="Type on the PC">Aa</button>
    <button class="bar-btn" id="settings-btn" type="button" aria-label="Settings">&#8801;</button>
  </div>
</header>

<main class="surface" id="surface" aria-label="Touch surface">
  <canvas id="ink"></canvas>
  <p class="hint" id="hint">One finger moves. Two scroll. Three and four swipe.</p>
</main>

<nav class="buttons" id="buttons" hidden>
  <button class="mbtn" data-btn="left" type="button">Left</button>
  <button class="mbtn" data-btn="right" type="button">Right</button>
</nav>

<textarea id="typer" class="typer" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Text goes to the PC"> </textarea>

<div class="overlay" id="overlay">
  <div class="overlay-card">
    <p class="overlay-title" id="overlay-title">Connecting to your PC</p>
    <p class="overlay-body" id="overlay-body">Make sure the phone and the laptop are on the same Wi-Fi and the host is running.</p>
    <button class="btn" id="retry-btn" type="button">Try again</button>
  </div>
</div>

<section class="sheet" id="sheet" aria-label="Settings" hidden>
  <div class="sheet-head">
    <h2>Settings</h2>
    <button class="bar-btn" id="sheet-close" type="button" aria-label="Close settings">&times;</button>
  </div>
  <div class="sheet-body" id="sheet-body"></div>
</section>

<script src="/static/settings.js"></script>
<script src="/static/gestures.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
